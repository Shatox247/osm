name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build application
        shell: cmd
        run: |
          where qmake
          where cl
          where nmake
          qmake -v
          qmake OpenSoundMeter.pro CONFIG+=release
          nmake

      - name: Bundle Qt dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item release\OpenSoundMeter.exe package\
          windeployqt `
            --release `
            --qmldir qml `
            --compiler-runtime `
            package\OpenSoundMeter.exe
          Copy-Item README.md package\

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: OpenSoundMeter-windows
          path: package
          if-no-files-found: error
