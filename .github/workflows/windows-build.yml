name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: win64_mingw81
          cache: true

      - name: Select Qt MinGW toolchain
        shell: pwsh
        run: |
          $qtVersionDir = Split-Path $env:QT_ROOT_DIR -Parent
          $qtInstallDir = Split-Path $qtVersionDir -Parent
          $toolchain = Get-ChildItem (Join-Path $qtInstallDir "Tools") -Directory |
            Where-Object { $_.Name -match '^mingw' -and (Test-Path (Join-Path $_.FullName "bin\g++.exe")) } |
            Select-Object -First 1
          if (-not $toolchain) {
            throw "Could not find a Qt MinGW toolchain in $(Join-Path $qtInstallDir 'Tools')."
          }
          $mingwBin = Join-Path $toolchain.FullName "bin"
          if (-not (Test-Path (Join-Path $mingwBin "g++.exe"))) {
            throw "The Qt MinGW toolchain does not contain g++.exe: $mingwBin"
          }
          "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "Using Qt MinGW toolchain: $mingwBin"
          & (Join-Path $mingwBin "g++.exe") --version

      - name: Build application
        shell: pwsh
        run: |
          where.exe qmake
          where.exe g++
          where.exe mingw32-make
          qmake OpenSoundMeter.pro CONFIG+=release
          mingw32-make -j2

      - name: Bundle Qt dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item release\OpenSoundMeter.exe package\
          windeployqt `
            --release `
            --qmldir qml `
            --compiler-runtime `
            package\OpenSoundMeter.exe
          Copy-Item README.md package\

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: OpenSoundMeter-windows
          path: package
          if-no-files-found: error
